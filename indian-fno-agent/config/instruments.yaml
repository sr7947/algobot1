# Expiry calendar settings
expiry:
  monthly:
    rule: "last_thursday"  # Last Thursday of month
  weekly:
    NIFTY:
      day: "thursday"
    BANKNIFTY:
      day: "wednesday"
    FINNIFTY:
      day: "tuesday"
    SENSEX:
      day: "friday"

# Market hours (IST)
market_hours:
  pre_market:
    start: "09:00"
    end: "09:08"
  normal:
    start: "09:15"
    end: "15:30"
  post_market:
    start: "15:40"
    end: "16:00"

