[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-fno-agent"
version = "1.0.0"
description = "AI-powered Indian F&O Trading Agent with Telegram approval workflow"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Kumar Shanu"}]
keywords = ["trading", "algo-trading", "options", "futures", "nse", "india", "telegram"]

dependencies = [
    # Web framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    # Pydantic
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Database
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
    # Broker SDKs
    "smartapi-python>=1.3.0",
    "pyotp>=2.9.0",
    # Telegram
    "python-telegram-bot>=21.0",
    # AI / LLM
    "google-generativeai>=0.3.0",
    # Data & Analysis
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "ta-lib>=0.4.28",
    "scipy>=1.11.0",
    # News
    "aiohttp>=3.9.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    # Scheduling
    "apscheduler>=3.10.0",
    "celery[redis]>=5.3.0",
    # Logging
    "structlog>=23.2.0",
    # Config
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    # Utilities
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "pytz>=2023.3",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]

[project.scripts]
fno-agent = "api.main:app"

[tool.setuptools.packages.find]
include = ["core*", "config*", "broker*", "market_data*", "indicators*",
           "strategies*", "news*", "risk*", "execution*", "agents*",
           "telegram_bot*", "audit*", "backtesting*", "scheduler*", "api*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "ANN", "B", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
