version: "3.9"

services:
  # ──────────────────────────────────────────
  # PostgreSQL (main database)
  # ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: fno_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fnoagent
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: fnoagent
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnoagent"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Redis (cache, queue, kill switch state)
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fno_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # FastAPI Backend
  # ──────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fno_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./backtests:/app/backtests
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ──────────────────────────────────────────
  # Celery Worker (async tasks)
  # ──────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fno_celery
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    command: celery -A scheduler.celery_app worker --loglevel=info --concurrency=4

  # ──────────────────────────────────────────
  # Celery Beat (scheduler)
  # ──────────────────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fno_beat
    restart: unless-stopped
    depends_on:
      - redis
      - postgres
    env_file:
      - .env
    command: celery -A scheduler.celery_app beat --loglevel=info

  # ──────────────────────────────────────────
  # React Dashboard (served by nginx)
  # ──────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dashboard
    container_name: fno_dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: fno_network
